name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer les tests
        run: |
          pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Définir le tag Docker
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tp-cicd:${{ steps.version.outputs.tag }} .

      - name: Publier l'image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tp-cicd:${{ steps.version.outputs.tag }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/tp-cicd:${{ needs.docker.outputs.tag }}

    steps:
      - name: Télécharger l'image publiée
        run: |
          docker pull "$APP_IMAGE"

      - name: Exécuter le conteneur de démonstration
        run: |
          app_result=$(docker run --rm "$APP_IMAGE")
          echo "$app_result"
          test "$app_result" = "30"
